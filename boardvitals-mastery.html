function stateBadge(state) {
  const map = {Mastered:'badge-mastered',Strong:'badge-strong',Developing:'badge-developing',Emerging:'badge-emerging',Fragile:'badge-fragile'};
  return `<span class="badge ${map[state]||'badge-developing'}">${state}</span>`;
}
function stateColor(state) {
  const map = {Mastered:'#059669',Strong:'#0891B2',Developing:'#2563EB',Emerging:'#D97706',Fragile:'#EA580C'};
  return map[state]||'#2563EB';
}
function decayColor(d) { return d>60?'#DC2626':d>35?'#D97706':'#059669'; }
function decayBadge(d) {
  if(d>60) return '<span class="badge badge-high">High risk</span>';
  if(d>35) return '<span class="badge badge-medium">Medium risk</span>';
  return '<span class="badge badge-low">Low risk</span>';
}
function trendIcon(t) {
  if(t==='up') return '<span style="color:#059669;font-size:13px;">↑ Rising</span>';
  if(t==='down') return '<span style="color:#DC2626;font-size:13px;">↓ Falling</span>';
  return '<span style="color:#64748B;font-size:13px;">→ Stable</span>';
}
function sparkline(history, w=80, h=28) {
  const min=Math.min(...history), max=Math.max(...history), range=max-min||1;
  const pts=history.map((v,i)=>{
    const x=(i/(history.length-1))*w;
    const y=h-((v-min)/range)*(h-4)+2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const rising=history[history.length-1]>=history[0];
  const color=rising?'#059669':'#DC2626';
  const fill=rising?'rgba(5,150,105,0.08)':'rgba(220,38,38,0.08)';
  const last=history[history.length-1];
  const lastX=w, lastY=h-((last-min)/range)*(h-4)+2;
  const firstY=h-((history[0]-min)/range)*(h-4)+2;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
    <polygon points="0,${firstY} ${pts.split(' ').join(' ')} ${lastX},${h} 0,${h}" fill="${fill}"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function masteryState(pct) {
  if(pct>=86) return 'Mastered';
  if(pct>=76) return 'Strong';
  if(pct>=60) return 'Developing';
  return 'Emerging';
}
function avgMastery() {
  return Math.round(S.concepts.reduce((s,c)=>s+c.mastery,0)/S.concepts.length);
}
function getFragile() {
  return S.concepts.filter(c=>c.state==='Fragile'||c.decay>55).sort((a,b)=>b.decay-a.decay);
}
function showToast(msg) {
  const t=document.getElementById('toast');
  document.getElementById('toast-text').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),4000);
}

// ============================================================
// QUIZ
// ============================================================
function getQuizQuestions(conceptId) {
  return QUIZ_BANK[conceptId] || DEFAULT_QUIZ;
}

function openQuiz(conceptId) {
  S.quiz = {active:true,conceptId,qIndex:0,answers:[],answered:false,selectedOpt:null,complete:false};
  document.getElementById('quiz-modal').classList.add('open');
  renderQuiz();
}

function renderQuiz() {
  const c = S.concepts.find(x=>x.id===S.quiz.conceptId);
  const questions = getQuizQuestions(S.quiz.conceptId);
  const q = S.quiz;

  if(q.complete) {
    const correct = q.answers.filter(a=>a).length;
    const total = questions.length;
    const gain = correct===total?12:correct===total-1?6:correct===1?2:0;
    const oldMastery = c.mastery;
    const newMastery = Math.min(99, oldMastery + gain);
    const newState = gain>0 ? masteryState(newMastery) : c.state;

    document.getElementById('quiz-content').innerHTML = `
    <div style="text-align:center;padding:8px 0">
      <div style="font-size:40px;margin-bottom:12px">${correct===total?'🎯':correct>=2?'✅':'📚'}</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:4px">${correct}/${total} correct</div>
      <div class="text-muted text-sm mb-24">${c.name}</div>

      <div style="background:#F0F7FF;border:1.5px solid #BFDBFE;border-radius:12px;padding:20px;margin-bottom:20px">
        <div class="text-xs font-600 text-muted mb-12" style="text-transform:uppercase">Mastery updated</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px">
          <div style="font-size:28px;font-weight:700;color:#64748B">${oldMastery}%</div>
          <div style="font-size:24px;color:#2563EB">→</div>
          <div style="font-size:28px;font-weight:700;color:${stateColor(newState)}">${newMastery}%</div>
        </div>
        ${gain>0?`<div style="font-size:13px;color:#059669">+${gain} points · State: ${newState}</div>`:`<div style="font-size:13px;color:#DC2626">Keep reviewing — more practice needed</div>`}
      </div>

      <div style="text-align:left;background:#F8FAFC;border-radius:10px;padding:16px;margin-bottom:20px">
        ${questions.map((qq,i)=>`
        <div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:${i<questions.length-1?'1px solid #E2E8F0':'none'}">
          <div style="width:22px;height:22px;border-radius:50%;background:${q.answers[i]?'#D1FAE5':'#FEE2E2'};display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0">${q.answers[i]?'✓':'✗'}</div>
          <div class="text-sm" style="line-height:1.4">${qq.q.substring(0,80)}…</div>
        </div>`).join('')}
      </div>

      <button class="btn-primary" data-action="finish-quiz" data-mastery="${newMastery}" data-state="${newState}" style="width:100%;padding:13px;font-size:15px">Back to dashboard</button>
    </div>`;
    return;
  }

  const currentQ = questions[q.qIndex];
  const progress = ((q.qIndex)/(questions.length))*100;

  document.getElementById('quiz-content').innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div>
      <div class="text-xs font-600 text-muted" style="text-transform:uppercase;letter-spacing:0.05em">${c.subject}</div>
      <div style="font-weight:600;font-size:15px">${c.name}</div>
    </div>
    <button data-action="close-quiz" style="background:none;border:none;color:#94A3B8;cursor:pointer;font-size:22px;line-height:1">×</button>
  </div>

  <div style="margin-bottom:6px;display:flex;justify-content:space-between">
    <span class="text-xs text-muted">Question ${q.qIndex+1} of ${questions.length}</span>
    <span class="text-xs text-muted">${Math.round((q.qIndex/questions.length)*100)}% complete</span>
  </div>
  <div class="progress-bar mb-20" style="height:4px">
    <div class="progress-fill" style="width:${progress}%;background:#2563EB"></div>
  </div>

  <div style="font-size:15px;font-weight:500;line-height:1.65;margin-bottom:20px;color:#0F172A">${currentQ.q}</div>

  <div id="options">
  ${currentQ.opts.map((opt,i)=>{
    const cls = q.answered ? (i===currentQ.correct ? 'correct reveal-correct' : (i===q.selectedOpt ? 'incorrect' : '')) : '';
    const spanBg = q.answered&&i===currentQ.correct?'#059669':q.answered&&i===q.selectedOpt?'#DC2626':'#E2E8F0';
    const spanColor = q.answered?(i===currentQ.correct||i===q.selectedOpt?'white':'#64748B'):'#64748B';
    return `<button class="option-btn ${cls}" data-action="answer-quiz" data-value="${i}" ${q.answered?'disabled':''}>
      <span style="display:inline-block;width:22px;height:22px;border-radius:50%;background:${spanBg};color:${spanColor};font-size:11px;font-weight:600;text-align:center;line-height:22px;margin-right:10px;flex-shrink:0">${String.fromCharCode(65+i)}</span>${opt}
    </button>`;
  }).join('')}
  </div>

  ${q.answered?`
  <div style="background:${q.answers[q.qIndex]?'#F0FDF4':'#FFF7ED'};border:1px solid ${q.answers[q.qIndex]?'#A7F3D0':'#FED7AA'};border-radius:10px;padding:16px;margin-top:14px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:16px">${q.answers[q.qIndex]?'✅':'⚠️'}</span>
      <span style="font-weight:600;font-size:14px;color:${q.answers[q.qIndex]?'#065F46':'#92400E'}">${q.answers[q.qIndex]?'Correct':'Incorrect'}</span>
      ${!q.answers[q.qIndex]?`<span class="badge" style="background:${currentQ.type==='forgetting'?'#DBEAFE':'#FFEDD5'};color:${currentQ.type==='forgetting'?'#1E3A8A':'#9A3412'};font-size:11px">${currentQ.type==='forgetting'?'Forgetting risk':'Concept gap'}</span>`:''}
    </div>
    <div class="text-sm" style="line-height:1.65;color:#374151">${currentQ.explanation}</div>
    ${!q.answers[q.qIndex]?`<div class="text-xs mt-8" style="color:#64748B">${currentQ.type==='forgetting'?'You may have understood this before — spaced repetition will help.':'Consider reviewing the underlying mechanism before moving on.'}</div>`:''}
  </div>
  <button class="btn-primary" data-action="next-question" style="width:100%;margin-top:14px;padding:12px">${q.qIndex+1<questions.length?'Next question →':'See results'}</button>
  `:''}`;
}

// ============================================================
// CONCEPT DRAWER
// ============================================================
function openDrawer(conceptId) {
  S.drawer = {open:true,conceptId};
  const c = S.concepts.find(x=>x.id===conceptId);
  const questions = getQuizQuestions(conceptId);
  const lastAttempts = ['✓','✗','✓','✓','✗'].slice(0,Math.min(5,c.attempts));

  document.getElementById('drawer-content').innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
    <div>
      <div class="text-xs text-muted mb-4">${c.subject}</div>
      <div style="font-size:18px;font-weight:700;color:#0F2044;line-height:1.3">${c.name}</div>
      <div style="margin-top:8px">${stateBadge(c.state)}</div>
    </div>
    <button data-action="close-drawer" style="background:none;border:none;color:#94A3B8;cursor:pointer;font-size:22px;padding:4px">×</button>
  </div>

  <div class="grid-2 mb-16">
    <div style="background:#F8FAFC;border-radius:10px;padding:14px;border:1px solid #E2E8F0">
      <div class="text-xs text-muted mb-4">Mastery</div>
      <div style="font-size:26px;font-weight:700;color:${stateColor(c.state)}">${c.mastery}%</div>
      <div style="margin-top:8px">${sparkline(c.history,100,32)}</div>
    </div>
    <div style="background:#F8FAFC;border-radius:10px;padding:14px;border:1px solid #E2E8F0">
      <div class="text-xs text-muted mb-4">Decay risk</div>
      <div style="font-size:26px;font-weight:700;color:${decayColor(c.decay)}">${c.decay}%</div>
      <div class="text-xs text-muted mt-4">Review by: <strong>${c.reviewBy}</strong></div>
    </div>
  </div>

  <div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:14px;margin-bottom:16px">
    <div class="text-xs font-600 mb-6" style="text-transform:uppercase;color:#92400E">Error pattern</div>
    <div class="text-sm" style="color:#374151;line-height:1.6">${c.errorPattern}</div>
  </div>

  <div style="margin-bottom:16px">
    <div class="text-xs font-600 text-muted mb-8" style="text-transform:uppercase">Recent attempts (${c.attempts} total)</div>
    <div style="display:flex;gap:6px;align-items:center">
      ${lastAttempts.map(r=>`<div style="width:30px;height:30px;border-radius:8px;background:${r==='✓'?'#D1FAE5':'#FEE2E2'};display:flex;align-items:center;justify-content:center;font-size:14px">${r}</div>`).join('')}
      <div class="text-xs text-muted" style="margin-left:4px">last ${lastAttempts.length} shown</div>
    </div>
  </div>

  <div style="margin-bottom:16px">
    <div class="text-xs font-600 text-muted mb-8" style="text-transform:uppercase">Confidence</div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="progress-bar" style="flex:1;height:8px"><div class="progress-fill" style="width:${c.confidence}%;background:#7C3AED"></div></div>
      <div style="font-weight:600;font-size:14px;color:#7C3AED">${c.confidence}%</div>
    </div>
    <div class="text-xs text-muted mt-4">Based on answer speed and hesitation patterns</div>
  </div>

  <div style="background:#F8FAFC;border-radius:10px;padding:14px;border:1px solid #E2E8F0;margin-bottom:20px">
    <div class="text-xs font-600 text-muted mb-4" style="text-transform:uppercase">Recommended action</div>
    <div class="text-sm" style="color:#374151;margin-bottom:10px">${c.state==='Fragile'||c.decay>55?'Immediate review recommended — memory is still recoverable but decaying fast.':c.state==='Mastered'?'On track — no action needed for 2+ weeks.':'Continue building — 2–3 more review sessions to reach Strong.'}</div>
  </div>

  <button class="btn-primary" data-action="start-quiz" data-value="${c.id}" style="width:100%;padding:12px" onclick="closeDrawer()">Start review session →</button>`;

  document.getElementById('concept-drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}

function closeDrawer() {
  S.drawer = {open:false,conceptId:null};
  document.getElementById('concept-drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}

// ============================================================
// MAIN RENDER
// ============================================================
function renderMain() {
  renderNav();
  const pages = {dashboard:renderDashboard,mastery:renderMastery,forecast:renderForecast,planner:renderPlanner,instructor:renderInstructor};
  const fn = pages[S.page] || renderDashboard;
  const el = document.getElementById('main-content');
  el.innerHTML = fn();
  el.classList.remove('fade-in');
  void el.offsetWidth;
  el.classList.add('fade-in');
}

// ============================================================
// EVENT HANDLING
// ============================================================
function handleAction(action, value, e) {
  switch(action) {
    case 'navigate':
      S.page = value;
      renderMain();
      window.scrollTo(0,0);
      break;
    case 'dismiss-onboarding':
      S.onboardingDismissed = true;
      renderMain();
      break;
    case 'set-role':
      S.role = value;
      if(value==='instructor') S.page='instructor';
      else S.page='dashboard';
      renderMain();
      break;
    case 'filter-mastery':
      S.masteryFilter = value;
      renderMain();
      break;
    case 'sort-mastery':
      if(S.masterySort===value) S.masterySortDir = S.masterySortDir==='asc'?'desc':'asc';
      else { S.masterySort=value; S.masterySortDir='asc'; }
      renderMain();
      break;
    case 'expand-forecast':
      S.forecastExpanded = S.forecastExpanded===value?null:value;
      renderMain();
      break;
    case 'start-quiz':
      closeDrawer();
      openQuiz(value);
      break;
    case 'close-quiz':
      document.getElementById('quiz-modal').classList.remove('open');
      S.quiz.active=false;
      break;
    case 'answer-quiz': {
      if(S.quiz.answered) return;
      const optIdx = parseInt(value);
      const qs = getQuizQuestions(S.quiz.conceptId);
      const isCorrect = optIdx === qs[S.quiz.qIndex].correct;
      S.quiz.answered = true;
      S.quiz.selectedOpt = optIdx;
      S.quiz.answers.push(isCorrect);
      renderQuiz();
      break;
    }
    case 'next-question': {
      const questions = getQuizQuestions(S.quiz.conceptId);
      if(S.quiz.qIndex+1 < questions.length) {
        S.quiz.qIndex++;
        S.quiz.answered=false;
        S.quiz.selectedOpt=null;
        renderQuiz();
      } else {
        S.quiz.complete=true;
        renderQuiz();
      }
      break;
    }
    case 'finish-quiz': {
      const btn = e.target.closest('[data-mastery]');
      const newMastery = parseInt(btn ? btn.dataset.mastery : 0);
      const newState = btn ? btn.dataset.state : '';
      const cId = S.quiz.conceptId;
      const concept = S.concepts.find(c=>c.id===cId);
      if(concept && newMastery) {
        const oldM = concept.mastery;
        concept.mastery = newMastery;
        if(newState) concept.state = newState;
        concept.decay = Math.max(5, concept.decay - 25);
        concept.daysSince = 0;
        concept.history.push(newMastery);
        concept.trend = newMastery>oldM?'up':newMastery<oldM?'down':'stable';
        document.getElementById('quiz-modal').classList.remove('open');
        S.quiz.active=false;
        S.page='dashboard';
        renderMain();
        setTimeout(()=>showToast(`${concept.name} mastery updated to ${newMastery}%`),300);
      }
      break;
    }
    case 'open-drawer':
      openDrawer(value);
      break;
    case 'close-drawer':
      closeDrawer();
      break;
    case 'suggest-intervention':
      S.interventionStudentId = S.interventionStudentId===value?null:value;
      renderMain();
      break;
    case 'close-intervention':
      S.interventionStudentId = null;
      renderMain();
      break;
    case 'assign-intervention': {
      const st = S.students.find(s=>s.id===value);
      if(st) { st.flagged=false; st.trend='up'; }
      S.interventionStudentId=null;
      renderMain();
      showToast(`Review set assigned to ${st ? st.name : 'student'}`);
      break;
    }
  }
}

// Delegation — main content
document.getElementById('main-content').addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  handleAction(t.dataset.action, t.dataset.value, e);
});

// Delegation — quiz modal
document.getElementById('quiz-modal').addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  handleAction(t.dataset.action, t.dataset.value, e);
});

// Delegation — drawer
document.getElementById('concept-drawer').addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  handleAction(t.dataset.action, t.dataset.value, e);
});

// Delegation — drawer overlay
document.getElementById('drawer-overlay').addEventListener('click', ()=>closeDrawer());

// Delegation — sidebar
document.querySelector('.sidebar').addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  handleAction(t.dataset.action, t.dataset.value, e);
});

// ============================================================
// INIT
// ============================================================
renderMain();
</script>
